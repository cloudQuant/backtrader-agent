[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrader-agent"
version = "0.2.0"
description = "Independent, deterministic Backtrader strategy-authoring agent runtime"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cloudQuant" }]
dependencies = []

[project.optional-dependencies]
backtest = [
  "backtrader @ git+https://github.com/cloudQuant/backtrader.git",
  "pandas>=1.0",
]
single-test = ["pytest>=7"]
# Opt-in LLM-in-the-loop eval gate (scripts/eval_llm_loop.py, R11) only.
# Never a runtime dependency: the runtime has no model SDK.
eval = ["anthropic>=0.40"]
test = [
  "backtrader @ git+https://github.com/cloudQuant/backtrader.git",
  "pandas>=1.0",
  "pytest>=7",
  "jsonschema>=4.18",
  "build>=1",
  "setuptools>=68",
  "wheel>=0.41",
]

[project.scripts]
backtrader-agent = "backtrader_agent.cli:main"
btagent = "backtrader_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backtrader_agent = [
  "resources/*.json",
  "resources/*.md",
  "resources/adapters/claude-code/*.md",
  "resources/adapters/codex/*.toml",
  "resources/adapters/opencode/*.md",
  "resources/adapters/openclaw/workspace/*.md",
  "resources/adapters/openclaw/workspace/*.json",
  "resources/contracts/*.json",
  "resources/catalog/*.json",
  "resources/catalog/*.jsonl",
  "resources/policies/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
